# Static analysis configuration for DocuAI.
#
# Stricter than the Flutter default: the extra rules below are the ones that
# catch real defects in an offline, storage-heavy app (unawaited futures, silent
# type coercion, leaked resources) rather than stylistic preferences.
include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    # An unawaited Future around a Hive write silently loses data — promote it
    # from a hint to a build failure.
    unawaited_futures: error
    missing_required_param: error
    # Freezed/Hive generators legitimately annotate private constructors.
    invalid_annotation_target: ignore

  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "build/**"

  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    # --- Correctness -------------------------------------------------------
    always_declare_return_types: true
    avoid_dynamic_calls: true
    avoid_slow_async_io: true
    cancel_subscriptions: true
    close_sinks: true
    only_throw_errors: true
    throw_in_finally: true
    unawaited_futures: true
    unnecessary_statements: true

    # --- Architecture boundaries -------------------------------------------
    # Relative imports inside lib/ keep layer violations visible in review;
    # an absolute `package:docuai/...` import in a feature is a smell.
    prefer_relative_imports: true
    avoid_relative_lib_imports: true
    implementation_imports: true

    # --- Style / readability ------------------------------------------------
    prefer_single_quotes: true
    prefer_final_locals: true
    prefer_final_in_for_each: true
    directives_ordering: true
    sort_child_properties_last: true
    use_super_parameters: true
    require_trailing_commas: true
    unnecessary_parenthesis: true
    unnecessary_lambdas: true

    # --- Flutter-specific ---------------------------------------------------
    use_build_context_synchronously: true
    use_colored_box: true
    use_decorated_box: true
    avoid_unnecessary_containers: true
    sized_box_for_whitespace: true
